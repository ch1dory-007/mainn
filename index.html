<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>

  <style>
    /* ===== Базовые стили ===== */
    :root {
      --text-color: #ffffff;
      --glass-background: rgba(255, 255, 255, 0.16);
      --glass-border: rgba(255, 255, 255, 0.32);
      --glass-shadow: rgba(0, 0, 0, 0.25);
      --panel-radius: 28px;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      color: var(--text-color);
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: url("https://www.image2url.com/r2/default/images/1785847968277-cb7ef0c8-6639-49c3-ba68-834c79c3b297.png") center/cover no-repeat fixed;
    }
    button, input, textarea { font: inherit; }
    button { border: none; cursor: pointer; }

    /* ===== Интерфейс (стеклянная панель) ===== */
    #interface {
      position: fixed;
      top: 50%;
      left: 50%;
      width: min(950px, calc(100vw - 100px));
      height: 580px;
      padding: 20px;
      transform: translate(-50%, -50%);
      background: var(--glass-background);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border: 1px solid var(--glass-border);
      border-radius: var(--panel-radius);
      box-shadow: 0 20px 50px var(--glass-shadow);
      overflow: hidden;
    }
    #interface > * {
      position: absolute;
      touch-action: none;
      user-select: none;
      cursor: grab;
      transition: box-shadow 0.2s ease;
    }
    #interface > *:active {
      cursor: grabbing;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      z-index: 100;
    }

    /* ===== Часы ===== */
    #time {
      text-align: center;
      user-select: none;
      top: 20px;
      left: 30px;
      width: auto;
    }
    #clock {
      margin: 0;
      color: #000;
      font-size: clamp(48px, 7vw, 90px);
      font-weight: 800;
      line-height: 0.8;
      letter-spacing: 2px;
    }
    #date {
      margin: 12px 0 0;
      font-size: 16px;
      font-weight: 500;
      opacity: 0.88;
      color: #000;
    }

    /* ===== Поиск (капсула) ===== */
    .search-container-capsule {
      display: flex;
      align-items: center;
      position: fixed;
      top: 100px;
      left: 100px;
      width: 400px;
      max-width: 90vw;
      height: 50px;
      background-color: #f1b3b5;
      border-radius: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1), 0 0 15px rgba(241,179,181,0.5);
      padding: 3px;
      box-sizing: border-box;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      cursor: grab;
      z-index: 50;
    }
    .search-container-capsule:active { cursor: grabbing; }
    .search-icon-button {
      width: 44px;
      height: 44px;
      background: #fff;
      border-radius: 50%;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-right: 15px;
      transition: transform 0.2s ease, background 0.2s ease;
      flex-shrink: 0;
    }
    .search-icon-button svg { color: #444; }
    .search-icon-button:hover { transform: scale(1.05); background: #f9f9f9; }
    #search-input {
      flex: 1;
      height: 100%;
      border: none;
      background: transparent;
      color: #fff;
      font-family: sans-serif;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
      padding-left: 5px;
      min-width: 0;
      outline: none;
    }
    #search-input::placeholder { color: rgba(255,255,255,0.8); }

    /* ===== Заметка ===== */
    #notes-container {
      width: min(340px, 90%);
      min-width: 150px;
      max-width: 90%;
    }
    #notes {
      width: 100%;
      min-height: 60px;
      height: auto;
      padding: 12px 16px;
      resize: vertical;
      color: #fff;
      outline: none;
      background: rgba(0,0,0,0.14);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 18px;
      opacity: 0.7;
      transition: opacity 250ms ease, background 250ms ease;
      font-size: 14px;
      line-height: 1.5;
      overflow-y: auto;
    }
    #notes:hover, #notes:focus {
      opacity: 1;
      background: rgba(0,0,0,0.25);
    }
    #notes::placeholder { color: rgba(255,255,255,0.7); }

    /* ===== Календарь ===== */
    .calendar-card {
      width: min(260px, 90%);
      background: rgba(0,0,0,0.2);
      border-radius: 24px;
      padding: 14px 16px;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      top: 180px;
      left: 30px;
    }
    .month-header {
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .calendar-divider {
      height: 1px;
      background: rgba(255,255,255,0.15);
      margin-bottom: 10px;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      row-gap: 6px;
      text-align: center;
    }
    .weekday { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5); }
    .day {
      font-size: 13px;
      font-weight: 500;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .day.empty { visibility: hidden; }
    .day.today {
      background: #fff;
      color: #000;
      border-radius: 8px;
      font-weight: 700;
    }

    /* ===== Левая панель виджетов ===== */
    #linkblocks {
      position: fixed;
      top: 50%;
      left: 32px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 20px 14px;
      background: var(--glass-background);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border: 1px solid var(--glass-border);
      border-radius: 34px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.22);
      z-index: 200;
      max-height: 80vh;
      overflow-y: auto;
      scrollbar-width: thin;
      min-width: 68px;
    }
    #linkblocks::-webkit-scrollbar { width: 4px; }
    #linkblocks::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
    .quick-link {
      position: relative;
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      text-decoration: none;
      background: rgba(255,255,255,0.13);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      transition: transform 180ms ease, background 180ms ease;
      flex-shrink: 0;
    }
    .quick-link:hover { transform: scale(1.12); background: rgba(255,255,255,0.3); }
    .quick-link img { width: 30px; height: 30px; object-fit: contain; pointer-events: none; }
    
    /* Удаление виджетов - новая кнопка под иконкой */
    .widget-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .widget-wrapper .remove-widget {
      width: 20px;
      height: 20px;
      background: rgba(220, 50, 50, 0.9);
      border-radius: 50%;
      color: #fff;
      font-size: 12px;
      line-height: 20px;
      text-align: center;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.3);
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      transform: scale(0.8);
      flex-shrink: 0;
      margin-top: -6px;
    }
    .widget-wrapper:hover .remove-widget {
      opacity: 1;
      transform: scale(1);
    }
    .widget-wrapper .remove-widget:hover {
      background: rgba(200, 30, 30, 1);
      transform: scale(1.1);
    }

    #add-widget-btn {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: rgba(255,255,255,0.2);
      border: 2px dashed rgba(255,255,255,0.4);
      color: #fff;
      font-size: 32px;
      line-height: 1;
      display: grid;
      place-items: center;
      transition: background 0.2s, transform 0.2s;
      cursor: pointer;
      flex-shrink: 0;
    }
    #add-widget-btn:hover { background: rgba(255,255,255,0.35); transform: scale(1.05); }

    /* ===== Свободная картинка ===== */
    #free-image-widget {
      position: fixed;
      top: 50px;
      left: 50px;
      z-index: 9999 !important;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }
    #free-image-widget:active { cursor: grabbing; }
    #free-image-widget img {
      width: clamp(180px, 25vw, 340px);
      height: auto;
      display: block;
      border-radius: 18px;
      pointer-events: none;
    }

    /* ===== Настройки ===== */
    #settings-button {
      position: fixed;
      right: 22px;
      bottom: 22px;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      color: #fff;
      background: rgba(20,20,28,0.38);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      z-index: 1001;
      transition: transform 200ms ease, background 200ms ease;
    }
    #settings-button:hover { transform: scale(1.08) rotate(15deg); background: rgba(20,20,28,0.62); }
    #settings-button svg { width: 24px; height: 24px; }

    #settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      opacity: 0;
      visibility: hidden;
      z-index: 998;
      transition: opacity 200ms ease, visibility 200ms ease;
    }
    #settings-overlay.open { opacity: 1; visibility: visible; }

    #settings-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: min(520px, 100vw);
      height: 100vh;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: rgba(19,20,28,0.94);
      backdrop-filter: blur(30px) saturate(130%);
      border-left: 1px solid rgba(255,255,255,0.14);
      box-shadow: -20px 0 60px rgba(0,0,0,0.35);
      transform: translateX(105%);
      z-index: 1000;
      transition: transform 260ms ease;
    }
    #settings-panel.open { transform: translateX(0); }
    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }
    .settings-title { margin: 0; font-size: 22px; font-weight: 650; }
    .settings-description {
      margin: -7px 0 0;
      color: rgba(255,255,255,0.65);
      font-size: 14px;
      line-height: 1.5;
    }
    #close-settings {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      color: #fff;
      background: rgba(255,255,255,0.1);
      border-radius: 13px;
    }
    #close-settings:hover { background: rgba(255,255,255,0.18); }
    #css-editor {
      width: 100%;
      flex: 1;
      min-height: 200px;
      padding: 17px;
      resize: none;
      color: #d8f3dc;
      caret-color: #fff;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 14px;
      line-height: 1.55;
      outline: none;
      background: rgba(0,0,0,0.36);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      tab-size: 2;
    }
    #css-editor:focus { border-color: rgba(255,255,255,0.32); }
    .settings-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .settings-action {
      min-height: 43px;
      padding: 10px 14px;
      color: #fff;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 13px;
      transition: background 160ms ease, transform 160ms ease;
    }
    .settings-action:hover { background: rgba(255,255,255,0.18); transform: translateY(-1px); }
    #reset-css { background: rgba(174,49,49,0.3); }
    #reset-css:hover { background: rgba(174,49,49,0.48); }
    #editor-status {
      min-height: 20px;
      margin: 0;
      color: rgba(255,255,255,0.6);
      font-size: 13px;
    }

    /* ===== Адаптивность ===== */
    @media (max-width: 1024px) {
      #interface {
        width: min(900px, calc(100vw - 80px));
        height: auto;
        min-height: 500px;
      }
      #linkblocks {
        left: 15px;
        padding: 16px 10px;
        gap: 12px;
        min-width: 60px;
      }
      .quick-link, #add-widget-btn {
        width: 48px;
        height: 48px;
      }
      .quick-link img { width: 26px; height: 26px; }
      .widget-wrapper .remove-widget {
        width: 18px;
        height: 18px;
        font-size: 10px;
        line-height: 18px;
      }
    }

    @media (max-width: 850px) {
      body { overflow-y: auto; }
      #interface {
        position: relative;
        top: auto;
        left: auto;
        width: calc(100% - 30px);
        min-height: calc(100vh - 140px);
        margin: 70px auto 20px;
        padding: 20px 15px;
        transform: none;
        height: auto;
        border-radius: 24px;
      }
      #interface > * {
        position: relative !important;
        top: auto !important;
        left: auto !important;
        transform: none !important;
        margin: 8px 0;
        width: 100% !important;
        max-width: 100% !important;
        cursor: default;
      }
      #interface > *:active {
        cursor: default;
        box-shadow: none;
        z-index: auto;
      }
      #time { text-align: center; }
      #clock { font-size: clamp(42px, 10vw, 70px); }
      #notes-container { min-width: unset; }
      #notes { min-height: 50px; }
      .calendar-card { width: 100% !important; max-width: 320px; margin: 0 auto; }
      
      #linkblocks {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        flex-direction: row;
        overflow-x: auto;
        max-width: calc(100vw - 30px);
        padding: 10px 14px;
        gap: 10px;
        border-radius: 28px;
        min-width: unset;
        width: auto;
        max-height: 70px;
      }
      .quick-link, #add-widget-btn {
        width: 42px;
        height: 42px;
        min-width: 42px;
      }
      .quick-link img { width: 22px; height: 22px; }
      .widget-wrapper .remove-widget {
        display: none; /* Скрываем на мобильных */
      }
      #add-widget-btn { font-size: 24px; }
      
      #free-image-widget {
        position: relative;
        top: auto;
        left: auto;
        margin: 10px auto;
        width: fit-content;
        cursor: default;
      }
      #free-image-widget img {
        width: clamp(140px, 40vw, 260px);
      }
      #free-image-widget:active { cursor: default; }
      
      .search-container-capsule {
        position: relative !important;
        top: auto !important;
        left: auto !important;
        transform: none !important;
        width: 100%;
        max-width: 400px;
        margin: 5px auto;
        cursor: default;
      }
      .search-container-capsule:active { cursor: default; }
      
      #settings-button {
        right: 15px;
        bottom: 15px;
        width: 44px;
        height: 44px;
      }
      #settings-button svg { width: 20px; height: 20px; }
    }

    @media (max-width: 480px) {
      #interface { padding: 14px 12px; margin: 60px auto 15px; }
      #clock { font-size: 36px; }
      #date { font-size: 13px; }
      .search-container-capsule { height: 44px; }
      .search-icon-button { width: 36px; height: 36px; }
      .search-icon-button svg { width: 16px; height: 16px; }
      #search-input { font-size: 14px; }
      #notes { font-size: 13px; padding: 10px 14px; }
      .calendar-card { padding: 10px 12px; }
      .month-header { font-size: 16px; }
      .day { font-size: 12px; height: 24px; }
      .settings-actions { grid-template-columns: 1fr; }
    }

    /* ===== Экран загрузки ===== */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #1e1e24;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loader-text { margin-top: 15px; color: #fff; font-family: sans-serif; font-size: 14px; letter-spacing: 1px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* ===== Адаптация картинки при высоте окна > 550px ===== */
@media (min-height: 551px) {
  #free-image-widget {
    top: 100px;    /* Измените под свои нужды */
    left: 100px;  /* Измените под свои нужды */
  }
  #free-image-widget img {
    width: clamp(220px, 30vw, 380px); /* Измените под свои нужды */
  }
}
  </style>

  <style id="custom-style"></style>
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
</head>

<body>

  <!-- Загрузчик -->
  <div id="loader"><div class="spinner"></div><div class="loader-text">Загрузка...</div></div>

  <!-- Левая панель виджетов -->
  <nav id="linkblocks" aria-label="Быстрые ссылки">
    <!-- Виджеты будут вставлены сюда через JS -->
    <button id="add-widget-btn" title="Добавить виджет">+</button>
  </nav>

  <!-- Главная стеклянная панель -->
  <main id="interface">
    <section id="time">
      <h1 id="clock">00:00</h1>
      <p id="date">Загрузка...</p>
    </section>

    <!-- Поиск (капсула) -->
    <form class="search-container-capsule" action="https://www.google.com/search" method="GET" target="_blank">
      <button type="submit" class="search-icon-button">
        <svg viewBox="0 0 20 20" width="18" height="18">
          <path fill="currentColor" d="M9.5 3a6.5 6.5 0 1 0 3.99 11.63l4.44 4.44a1 1 0 0 0 1.41-1.41l-4.44-4.44A6.5 6.5 0 0 0 9.5 3Zm-4.5 6.5a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0Z"/>
        </svg>
      </button>
      <input type="text" name="q" id="search-input" placeholder="Search..." autocomplete="off" autofocus>
    </form>

    <!-- Заметка -->
    <section id="notes-container" style="top:120px; left:420px; width:300px;">
      <textarea id="notes" placeholder="Заметка..." aria-label="Заметки"></textarea>
    </section>

    <!-- Календарь -->
    <section class="calendar-card">
      <div class="month-header" id="month-title"></div>
      <div class="calendar-divider"></div>
      <div class="calendar-grid">
        <div class="weekday">S</div><div class="weekday">M</div><div class="weekday">T</div>
        <div class="weekday">W</div><div class="weekday">T</div><div class="weekday">F</div><div class="weekday">S</div>
      </div>
      <div class="calendar-grid" id="days-container" style="margin-top:6px;"></div>
    </section>
  </main>

  <!-- Затемнение и настройки -->
  <div id="settings-overlay"></div>
  <aside id="settings-panel" aria-hidden="true">
    <div class="settings-header">
      <h2 class="settings-title">Пользовательский CSS</h2>
      <button id="close-settings" type="button" aria-label="Закрыть настройки">✕</button>
    </div>
    <p class="settings-description">Пиши CSS ниже. Применяется сразу и сохраняется автоматически.</p>
    <textarea id="css-editor" spellcheck="false" aria-label="Редактор пользовательского CSS"></textarea>
    <div class="settings-actions">
      <button id="copy-css" class="settings-action" type="button">Копировать</button>
      <button id="download-css" class="settings-action" type="button">Скачать CSS</button>
      <button id="reset-css" class="settings-action" type="button">Сбросить</button>
      <button id="reset-layout" class="settings-action" type="button">Сбросить виджеты</button>
    </div>
    <p id="editor-status"></p>
  </aside>

  <button id="settings-button" type="button" aria-label="Открыть настройки">
    <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.1 7.1 0 0 0-1.62-.94L14.38 2.8a.49.49 0 0 0-.49-.4h-3.84a.49.49 0 0 0-.49.4L9.2 5.32c-.58.24-1.12.55-1.62.94l-2.39-.96a.49.49 0 0 0-.61.22L2.66 8.84a.49.49 0 0 0 .12.64l2.03 1.58c-.05.31-.08.65-.08.94s.03.63.08.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.22.38.31.61.22l2.39-.96c.5.39 1.04.71 1.62.94l.36 2.52c.04.24.24.4.49.4h3.84c.25 0 .45-.16.49-.4l.36-2.52c.58-.24 1.12-.55 1.62-.94l2.39.96c.23.09.49 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.02-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/></svg>
  </button>

  <!-- Свободная картинка -->
  <div id="free-image-widget">
    <img src="https://www.image2url.com/r2/default/images/1785799639605-df80e18f-ecfb-4fab-a87f-614d5a9cc2a5.png" alt="anime-pic" />
  </div>

  <script>
    "use strict";

    // ===== Константы и хранилище =====
    const STORAGE_KEYS = {
      customCss: "startpage-custom-css",
      notes: "startpage-notes",
      widgets: "startpage-widgets",
      positions: "startpage-widget-positions"
    };

    const DEFAULT_WIDGETS = [
      { url: "https://youtube.com", icon: "https://www.google.com/s2/favicons?domain=youtube.com&sz=128", title: "YouTube" },
      { url: "https://open.spotify.com", icon: "https://www.google.com/s2/favicons?domain=spotify.com&sz=128", title: "Spotify" },
      { url: "https://pinterest.com", icon: "https://www.google.com/s2/favicons?domain=pinterest.com&sz=128", title: "Pinterest" },
      { url: "https://gemini.google.com", icon: "https://www.google.com/s2/favicons?domain=gemini.google.com&sz=128", title: "Gemini" }
    ];

    // ===== Загрузчик =====
    window.addEventListener('load', () => {
      setTimeout(() => document.getElementById('loader').classList.add('hidden'), 300);
    });

    // ===== Часы =====
    function updateClock() {
      const now = new Date();
      now.setHours(now.getHours() - 3);
      document.getElementById('clock').textContent = now.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
      const wd = now.toLocaleDateString("ru-RU", { weekday: "long" });
      const d = now.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" }).replace(/\./g, "/");
      document.getElementById('date').textContent = `${wd.charAt(0).toUpperCase()+wd.slice(1)}, ${d}`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // ===== Календарь =====
    function renderCalendar() {
      const now = new Date();
      now.setHours(now.getHours() - 3);
      const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
      const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      document.getElementById('month-title').textContent = monthNames[m];
      const container = document.getElementById('days-container');
      container.innerHTML = '';
      const firstDay = new Date(y, m, 1).getDay();
      const totalDays = new Date(y, m + 1, 0).getDate();
      for (let i = 0; i < firstDay; i++) { const div = document.createElement('div'); div.classList.add('day','empty'); container.appendChild(div); }
      for (let day = 1; day <= totalDays; day++) {
        const div = document.createElement('div');
        div.classList.add('day');
        div.textContent = day;
        if (day === d) div.classList.add('today');
        container.appendChild(div);
      }
    }
    renderCalendar();

    // ===== Заметка (автосохранение + авто-высота) =====
    const notesEl = document.getElementById('notes');
    const savedNotes = localStorage.getItem(STORAGE_KEYS.notes);
    if (savedNotes !== null) notesEl.value = savedNotes;
    notesEl.addEventListener('input', () => {
      localStorage.setItem(STORAGE_KEYS.notes, notesEl.value);
      notesEl.style.height = 'auto';
      notesEl.style.height = notesEl.scrollHeight + 'px';
    });
    setTimeout(() => { notesEl.style.height = 'auto'; notesEl.style.height = notesEl.scrollHeight + 'px'; }, 50);

    // ===== Виджеты (левая панель) =====
    const linkblocks = document.getElementById('linkblocks');
    let widgets = [];

    function loadWidgets() {
      const data = localStorage.getItem(STORAGE_KEYS.widgets);
      if (data) widgets = JSON.parse(data);
      else widgets = DEFAULT_WIDGETS.map(w => ({ ...w }));
      renderWidgets();
    }
    function saveWidgets() {
      localStorage.setItem(STORAGE_KEYS.widgets, JSON.stringify(widgets));
    }
    function renderWidgets() {
      const addBtn = document.getElementById('add-widget-btn');
      linkblocks.innerHTML = '';
      
      widgets.forEach((w, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'widget-wrapper';
        
        const a = document.createElement('a');
        a.className = 'quick-link';
        a.href = w.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.dataset.title = w.title;
        const img = document.createElement('img');
        img.src = w.icon;
        img.alt = w.title;
        a.appendChild(img);
        wrapper.appendChild(a);
        
        // Кнопка удаления под иконкой
        const remove = document.createElement('div');
        remove.className = 'remove-widget';
        remove.textContent = '✕';
        remove.title = 'Удалить виджет';
        remove.addEventListener('click', (e) => {
          e.stopPropagation();
          widgets.splice(idx, 1);
          saveWidgets();
          renderWidgets();
        });
        wrapper.appendChild(remove);
        
        linkblocks.appendChild(wrapper);
      });
      
      linkblocks.appendChild(addBtn);
    }

    // Добавление виджета
    document.getElementById('add-widget-btn').addEventListener('click', () => {
      const url = prompt('Введите URL (https://...):');
      if (!url) return;
      try {
        const domain = new URL(url).hostname;
        const icon = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
        const title = prompt('Название (или оставьте пустым):') || domain;
        widgets.push({ url, icon, title });
        saveWidgets();
        renderWidgets();
      } catch { alert('Некорректный URL'); }
    });

    loadWidgets();

    // ===== Перетаскивание (интерактивность) =====
    const defaultPositions = {
      "time": { x: 30, y: 20 },
      "notes-container": { x: 400, y: 120 },
      "calendar-card": { x: 30, y: 180 },
      "free-image-widget": { x: 50, y: 50 }
    };
    let savedPositions = JSON.parse(localStorage.getItem(STORAGE_KEYS.positions)) || structuredClone(defaultPositions);
    const historyStack = [];

    function applyPositions() {
      Object.keys(savedPositions).forEach(id => {
        let el = document.getElementById(id) || document.querySelector('.' + id);
        if (el) {
          const pos = savedPositions[id];
          el.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
          el.setAttribute('data-x', pos.x);
          el.setAttribute('data-y', pos.y);
        }
      });
    }

    // Настройка перетаскивания с защитой от перемещения при вводе текста
    function setupDraggable() {
      // Элементы, которые можно перетаскивать
      const draggableItems = document.querySelectorAll('#interface > section, #interface > form, #free-image-widget');
      
      draggableItems.forEach(el => {
        // Отключаем перетаскивание на мобильных устройствах
        if (window.innerWidth <= 850) {
          interact(el).draggable(false);
          return;
        }
        
        interact(el).draggable({
          inertia: true,
          modifiers: [
            interact.modifiers.restrictRect({
              restriction: 'parent',
              endOnly: true
            })
          ],
          listeners: {
            start(event) {
              // Проверяем, не является ли цель или её родитель полем ввода
              const target = event.target;
              const activeEl = document.activeElement;
              if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) {
                return false; // Отменяем перетаскивание
              }
              historyStack.push(structuredClone(savedPositions));
              if (historyStack.length > 20) historyStack.shift();
            },
            move(event) {
              const target = event.target;
              const activeEl = document.activeElement;
              if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) {
                return false;
              }
              const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
              const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
              target.style.transform = `translate(${x}px, ${y}px)`;
              target.setAttribute('data-x', x);
              target.setAttribute('data-y', y);
            },
            end(event) {
              const target = event.target;
              const activeEl = document.activeElement;
              if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) {
                return false;
              }
              let key = target.id || target.className.split(' ')[0];
              savedPositions[key] = {
                x: parseFloat(target.getAttribute('data-x')),
                y: parseFloat(target.getAttribute('data-y'))
              };
              localStorage.setItem(STORAGE_KEYS.positions, JSON.stringify(savedPositions));
            }
          }
        });
      });

      // Отдельная настройка для поиска с защитой
      const searchEl = document.querySelector('.search-container-capsule');
      if (searchEl && window.innerWidth > 850) {
        interact(searchEl).draggable({
          inertia: true,
          modifiers: [
            interact.modifiers.restrictRect({
              restriction: 'parent',
              endOnly: true
            })
          ],
          listeners: {
            start(event) {
              const activeEl = document.activeElement;
              if (activeEl && activeEl.id === 'search-input') {
                return false;
              }
              historyStack.push(structuredClone(savedPositions));
              if (historyStack.length > 20) historyStack.shift();
            },
            move(event) {
              const activeEl = document.activeElement;
              if (activeEl && activeEl.id === 'search-input') {
                return false;
              }
              const target = event.target;
              const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
              const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;
              target.style.transform = `translate(${x}px, ${y}px)`;
              target.setAttribute('data-x', x);
              target.setAttribute('data-y', y);
            },
            end(event) {
              const activeEl = document.activeElement;
              if (activeEl && activeEl.id === 'search-input') {
                return false;
              }
              const target = event.target;
              savedPositions['search-container-capsule'] = {
                x: parseFloat(target.getAttribute('data-x')),
                y: parseFloat(target.getAttribute('data-y'))
              };
              localStorage.setItem(STORAGE_KEYS.positions, JSON.stringify(savedPositions));
            }
          }
        });
      }
    }

    function undoLastMove() {
      if (historyStack.length > 0) {
        savedPositions = historyStack.pop();
        localStorage.setItem(STORAGE_KEYS.positions, JSON.stringify(savedPositions));
        applyPositions();
        showStatus('Действие отменено (Ctrl+Z)');
      }
    }
    function resetPositions() {
      historyStack.push(structuredClone(savedPositions));
      savedPositions = structuredClone(defaultPositions);
      localStorage.setItem(STORAGE_KEYS.positions, JSON.stringify(savedPositions));
      applyPositions();
      showStatus('Позиции сброшены');
    }

    // Применяем сохранённые позиции
    applyPositions();
    // Настраиваем перетаскивание
    setTimeout(setupDraggable, 100);

    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        if (['input','textarea'].includes(document.activeElement.tagName.toLowerCase())) return;
        e.preventDefault();
        undoLastMove();
      }
    });

    document.getElementById('reset-layout')?.addEventListener('click', resetPositions);

    // Перезапускаем перетаскивание при изменении размера окна
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(setupDraggable, 300);
    });

    // ===== Настройки (CSS) =====
    const DEFAULT_CUSTOM_CSS = `/* Пользовательский CSS */\n#interface { width: min(900px, calc(100vw - 220px)); }\n#clock { font-size: 90px; }`;
    const settingsButton = document.getElementById('settings-button');
    const settingsPanel = document.getElementById('settings-panel');
    const settingsOverlay = document.getElementById('settings-overlay');
    const closeSettings = document.getElementById('close-settings');
    const cssEditor = document.getElementById('css-editor');
    const customStyle = document.getElementById('custom-style');
    const editorStatus = document.getElementById('editor-status');
    let statusTimeout;

    function showStatus(msg) { editorStatus.textContent = msg; clearTimeout(statusTimeout); statusTimeout = setTimeout(() => editorStatus.textContent = '', 1800); }

    function applyCustomCss(css) { customStyle.textContent = css; }
    function saveCustomCss(css) { localStorage.setItem(STORAGE_KEYS.customCss, css); }
    function loadCustomCss() {
      const saved = localStorage.getItem(STORAGE_KEYS.customCss);
      const css = saved !== null ? saved : DEFAULT_CUSTOM_CSS;
      cssEditor.value = css;
      applyCustomCss(css);
    }
    loadCustomCss();
    cssEditor.addEventListener('input', () => {
      const css = cssEditor.value;
      applyCustomCss(css);
      saveCustomCss(css);
      showStatus('Сохранено автоматически');
    });
    cssEditor.addEventListener('keydown', e => {
      if (e.key === 'Tab') { e.preventDefault(); const s = cssEditor.selectionStart, v = cssEditor.value; cssEditor.value = v.substring(0,s) + '  ' + v.substring(s); cssEditor.selectionStart = cssEditor.selectionEnd = s + 2; cssEditor.dispatchEvent(new Event('input')); }
    });

    function openSettings() { settingsPanel.classList.add('open'); settingsOverlay.classList.add('open'); settingsPanel.setAttribute('aria-hidden','false'); setTimeout(() => cssEditor.focus(), 200); }
    function closeSettingsPanel() { settingsPanel.classList.remove('open'); settingsOverlay.classList.remove('open'); settingsPanel.setAttribute('aria-hidden','true'); }
    settingsButton.addEventListener('click', openSettings);
    closeSettings.addEventListener('click', closeSettingsPanel);
    settingsOverlay.addEventListener('click', closeSettingsPanel);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSettingsPanel(); });

    document.getElementById('copy-css').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(cssEditor.value); showStatus('CSS скопирован'); } catch { cssEditor.select(); document.execCommand('copy'); showStatus('CSS скопирован'); }
    });
    document.getElementById('download-css').addEventListener('click', () => {
      const blob = new Blob([cssEditor.value], { type: 'text/css;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'custom-style.css'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href); showStatus('CSS скачан');
    });
    document.getElementById('reset-css').addEventListener('click', () => {
      if (!confirm('Сбросить стили?')) return;
      cssEditor.value = DEFAULT_CUSTOM_CSS;
      applyCustomCss(DEFAULT_CUSTOM_CSS);
      saveCustomCss(DEFAULT_CUSTOM_CSS);
      showStatus('Стили сброшены');
    });

    // Фокус на поиск
    document.addEventListener('DOMContentLoaded', () => document.getElementById('search-input')?.focus());

    // ===== Исправление: Защита от перемещения при выделении текста мышкой =====
    document.addEventListener('mousedown', (e) => {
      const target = e.target;
      // Если клик на поле ввода или текстовой области - отключаем перетаскивание
      if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA') {
        // Запрещаем перетаскивание родительских элементов
        const parent = target.closest('.search-container-capsule, #notes-container, #interface > section, #interface > form');
        if (parent) {
          parent.style.touchAction = 'auto';
          parent.style.userSelect = 'text';
        }
      }
    });

    document.addEventListener('mouseup', (e) => {
      const target = e.target;
      if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA') {
        const parent = target.closest('.search-container-capsule, #notes-container, #interface > section, #interface > form');
        if (parent) {
          parent.style.touchAction = 'none';
          parent.style.userSelect = 'none';
        }
      }
    });

    // Дополнительная защита: при фокусе на поле ввода отключаем cursor: grab
    document.addEventListener('focusin', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        const parent = e.target.closest('.search-container-capsule, #notes-container, #interface > section, #interface > form, #free-image-widget');
        if (parent) {
          parent.style.cursor = 'default';
        }
      }
    });

    document.addEventListener('focusout', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        const parent = e.target.closest('.search-container-capsule, #notes-container, #interface > section, #interface > form, #free-image-widget');
        if (parent && window.innerWidth > 850) {
          parent.style.cursor = 'grab';
        }
      }
    });
  </script>
</body>
</html>
